<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 Rapid Fire // ESP32-C3 Flasher</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0c;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { color: #ffd60a; margin-bottom: 8px; }
    p { color: #aaa; max-width: 420px; line-height: 1.5; }
    .card {
      background: #141416;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 40px 50px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    esp-web-install-button {
      margin-top: 24px;
    }
    /* Make the button look nice */
    esp-web-install-button::part(button) {
      background: #ffd60a;
      color: #111;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PS3 Rapid Fire</h1>
    <p>v0.9.36 · ESP32-C3<br>
       Made by Vegueta1</p>
    <p>Connect your ESP32-C3 board via USB,<br>
       then click the button below.</p>

    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>

    <p style="margin-top:30px;font-size:0.85rem;color:#666">
      Works in Chrome / Edge / Opera<br>
      Hold BOOT button if the board is not detected
    </p>
  </div>
</body>
</html>
